[pytest]
asyncio_mode = auto
testpaths =
    tests
    tests/infrastructure
norecursedirs =
    .git
    .pytest_cache
    .venv
markers =
    unit: fast isolated tests for functions, models, and helpers
    logic: in-process domain or service behavior without external infrastructure
    route: in-process HTTP, WebSocket, or API boundary tests using ASGI/TestClient fakes
    repository: persistence and migration behavior, usually backed by Postgres
    integration: requires running infrastructure (docker-compose)
    business_case: end-to-end business workflow scenarios spanning several collaboration steps
    live: talks to a locally running Open Talon stack or external local service
    infra_config: static local infrastructure configuration checks
    live_compose: raw Docker Compose infrastructure smoke tests
    live_mcp: live machine-identity and MCP gateway tests
    live_compaction: live runtime compaction tests
    live_tinker: live Tinker generated-tool workflow tests
    live_operational_agents: live managed operational-agent workflow tests
    live_anchor: live Anchor topic-moderation tests
    live_retriever: live Retriever ingestion/search/vision tests
    live_system_plugins: live System Plugin sync and attachment tests
    live_web_search: live web-search MCP and SearXNG tests
    live_xwiki: live XWiki-backed dossier tests
addopts = -m "not integration"
