[pytest]
asyncio_mode = auto
testpaths =
    tests
    tests/infrastructure
norecursedirs =
    .git
    .pytest_cache
    .venv
markers =
    unit: fast isolated tests for functions, models, and helpers
    logic: in-process domain or service behavior without external infrastructure
    route: in-process HTTP, WebSocket, or API boundary tests using ASGI/TestClient fakes
    repository: persistence and migration behavior, usually backed by Postgres
    integration: requires running infrastructure (docker-compose)
    business_case: end-to-end business workflow scenarios spanning several collaboration steps
    live: talks to a locally running Open Talon stack or external local service
addopts = -m "not integration"
