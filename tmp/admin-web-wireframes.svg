  <text x="40" y="48" class="title">Open Talon Admin Web Wireframes</text>
  <text x="40" y="74" class="subtitle">Low-fidelity browser admin screens derived from implemented routes in apps/admin-web</text>

  <!-- Sign in -->
  <g transform="translate(40 110)">
    <rect x="0" y="0" width="1440" height="960" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="24" y="40" class="title">Sign In</text>
    <text x="24" y="64" class="subtitle">Unauthenticated entry state before OIDC redirect</text>
    <rect x="480" y="270" width="480" height="320" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="528" y="340" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Open Talon Administration</text>
    <text x="528" y="380" class="subtitle">Local-first control plane for organizations, runtimes, providers, tools, and workspaces.</text>
    <rect x="528" y="428" width="384" height="52" rx="12" fill="#3b82f6"/>
    <text x="640" y="460" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Sign in with Keycloak</text>
