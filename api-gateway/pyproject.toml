[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-senate-api-gateway"
version = "0.1.0"
description = "Open Senate API Gateway — multi-interface Kafka-driven chat layer"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # ── HTTP client ────────────────────────────────────────────────────────────
    "httpx>=0.27",
    # ── Postgres ───────────────────────────────────────────────────────────────
    "asyncpg>=0.29",
    # ── Valkey / Redis ─────────────────────────────────────────────────────────
    "redis>=5.0",
    # ── Kafka ──────────────────────────────────────────────────────────────────
    "aiokafka>=0.11",
    # ── Config ─────────────────────────────────────────────────────────────────
    "pydantic-settings>=2.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
tui = [
    "textual>=0.70",
    "websockets>=13",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
# Gateway
senate-gateway = "app.main:main"
# TUI
senate-tui = "tui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "tui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../test/api-gateway"]
