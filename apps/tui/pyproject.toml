[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-senate-tui"
version = "0.1.0"
description = "Open Senate terminal client"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "textual>=0.70",
    "websockets>=13",
]

[project.scripts]
senate-tui = "open_senate_tui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["open_senate_tui"]
