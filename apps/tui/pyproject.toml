[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-tui"
version = "0.1.0"
description = "Open Talon terminal client"
license = { text = "AGPL-3.0-only OR LicenseRef-Open-Talon-Commercial" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "textual>=0.70",
    "websockets>=13",
]

[project.scripts]
talon-tui = "open_talon_tui.main:main"
talon-tui2 = "open_talon_tui.tui2:main"
talon-user-client = "open_talon_tui.user_client:main"

[tool.hatch.build.targets.wheel]
packages = ["open_talon_tui"]
