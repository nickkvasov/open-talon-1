[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-agent-runtime"
version = "0.1.0"
description = "Reusable agent runtime for Open Talon"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "langfuse>=3.0",
    "asyncpg>=0.29",
    "aiokafka>=0.11",
    "open-talon-workspace-memory",
]

[project.scripts]
talon-agent-task-worker = "agent_runtime.agent_task_worker:main"
talon-agent-loop-worker = "agent_runtime.agent_loop_worker:main"
talon-tool-worker = "agent_runtime.tool_worker:main"
talon-reconciler = "agent_runtime.reconciler:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
