[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-agent-runtime"
version = "0.1.0"
description = "Reusable agent runtime for Open Talon"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "langfuse>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
