[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-web-search-mcp"
version = "0.1.0"
description = "Open Talon managed web search System Plugin MCP service"
license = { text = "AGPL-3.0-only OR LicenseRef-Open-Talon-Commercial" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.29",
    "crawl4ai>=0.4",
]

[project.scripts]
talon-web-search-mcp = "web_search_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["web_search_mcp"]
