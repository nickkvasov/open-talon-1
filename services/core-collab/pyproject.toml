[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-core-collab"
version = "0.1.0"
description = "Canonical collaboration kernel for Open Talon"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "asyncpg>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["core_collab"]
