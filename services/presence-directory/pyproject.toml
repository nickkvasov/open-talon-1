[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-presence-directory"
version = "0.1.0"
description = "Participant directory and presence service for Open Talon"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["presence_directory"]
