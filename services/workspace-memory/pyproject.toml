[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-workspace-memory"
version = "0.1.0"
description = "Workspace whiteboard memory service for Open Talon"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["workspace_memory"]
