[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-senate-task-router"
version = "0.1.0"
description = "Task routing service for Open Senate"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["task_router"]
