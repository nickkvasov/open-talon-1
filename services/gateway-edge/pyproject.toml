[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-gateway-edge"
version = "0.1.0"
description = "Open Talon gateway edge service"
license = { text = "AGPL-3.0-only OR LicenseRef-Open-Talon-Commercial" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "aiokafka>=0.11",
    "pydantic-settings>=2.3",
    "pydantic>=2.7",
    "PyJWT>=2.9",
    "cryptography>=43.0",
    "open-talon-workspace-memory",
]

[project.scripts]
talon-gateway-edge = "gateway_edge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway_edge"]
