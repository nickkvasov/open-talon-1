[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-talon-contracts"
version = "0.1.0"
description = "Shared contracts for Open Talon services and apps"
license = { text = "AGPL-3.0-only OR LicenseRef-Open-Talon-Commercial" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["open_talon_contracts"]
