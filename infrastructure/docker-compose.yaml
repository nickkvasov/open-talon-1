services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    restart: unless-stopped

  openbao:
    image: openbao/openbao:latest
    container_name: openbao
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN:-root}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${BAO_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./data/valkey:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      REQUIRED_MODELS: ${REQUIRED_MODELS:-gemma4:31b,gemma4:e4b}
      OLLAMA_MODELS: /root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - postgres
      - kafka
      - valkey
      - openbao
    environment:
      # ── Gateway ─────────────────────────────────────────────────
      PORT: ${GATEWAY_PORT:-8000}
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-none}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # ── Postgres ─────────────────────────────────────────────────
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      # ── Valkey ───────────────────────────────────────────────────
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      # ── Kafka ────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_REQUEST_TOPIC: ${KAFKA_REQUEST_TOPIC:-senate.chat.requests}
      KAFKA_RESPONSE_TOPIC: ${KAFKA_RESPONSE_TOPIC:-senate.chat.responses}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-api-gateway}
      # ── OpenBao ──────────────────────────────────────────────────
      OPENBAO_ADDRESS: http://openbao:8200
      OPENBAO_ADMIN_TOKEN: ${BAO_ROOT_TOKEN:-root}
      # ── Dev ──────────────────────────────────────────────────────
      ECHO_AGENT_ENABLED: ${ECHO_AGENT_ENABLED:-false}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
